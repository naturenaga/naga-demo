name: Deploy Application

# Trigger on push to main branch or manually via workflow_dispatch
on:
  # push:
    # branches:
      # - main
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up environment (e.g., install dependencies)
      - name: Set up environment
        run: |
          echo "Setting up environment..."
          # Add your setup commands here, e.g., npm install, pip install, etc.

      # Automatic deployment (triggered by push to main)
      - name: Auto Deploy
        if: github.event_name == 'push' # Runs only on push events
        run: |
          echo "Running automatic deployment..."
          # Add your deployment commands here, e.g., deploy to production

      # Manual deployment (triggered by workflow_dispatch)
      - name: Manual Deploy
        if: github.event_name == 'workflow_dispatch' # Runs only on manual trigger
        run: |
          echo "Running manual deployment..."
          # Add your deployment commands here, e.g., deploy to staging