name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build
        run: |
          # Build code here
          echo "Building code..."

      - name: Deploy to Dev
        run: |
          # Deploy to Dev environment
          echo "Deploying to Dev environment..."

      - name: Manual Approval for QA
        run: |
          echo "Waiting for manual approval for QA deployment"
          read -p "Approve deployment to QA? (y/n) " -n 1 -r
          echo    # (optional) move to a new line
          if [[ $REPLY =~ ^[Yy]$ ]]
          then
            # Deploy to QA environment
            echo "Deploying to QA environment..."
          else
            echo "Deployment to QA environment cancelled"
            exit 1
          fi

      - name: Manual Approval for Prod
        run: |
          echo "Waiting for manual approval for Prod deployment"
          read -p "Approve deployment to Prod? (y/n) " -n 1 -r
          echo    # (optional) move to a new line
          if [[ $REPLY =~ ^[Yy]$ ]]
          then
            # Deploy to Prod environment
            echo "Deploying to Prod environment..."
          else
            echo "Deployment to Prod environment cancelled"
            exit 1
          fi
